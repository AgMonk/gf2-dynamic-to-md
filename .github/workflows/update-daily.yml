name: 每日更新（动态/视频）

on:
  schedule:
    # UTC 18:00 = 北京时间凌晨 2:00，每天运行
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 增量更新：动态 + 视频（每天）
      - name: 增量更新动态与视频
        run: python scripts/update.py dynamic video

      - name: 提交并推送
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 每日更新动态/视频数据"
            git push
          fi
